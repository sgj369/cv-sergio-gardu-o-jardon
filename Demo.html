<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Demo Menú Superior Dinámico con Preloader Haku</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root{
      /* Tus variables */
      --bg-uniform: #333;
      --fg: #eef1f0;
      --muted: #a3a3a3;
      --accent-blue: #0077b6;
      --accent-purple: #9933cc;
      --accent-emerald: #2E8B57;
      
      --card-bg: rgba(0,0,0,0.88);
      --card-border: rgba(255,255,255,0.1); 
      /* --menu-width-collapsed: 70px;  <-- YA NO SE USA */
      --menu-height: 70px; /* Altura del nuevo menú superior */
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background-color: var(--bg-uniform);
      color: var(--fg);
      padding: 20px;
      overflow: hidden; 
    }
    
    /* 🚨 ESPACIO PARA EL MENÚ SUPERIOR FIJO 🚨 */
    /* Este padding empuja el contenido hacia abajo para que no quede debajo del menú */
    body.loaded {
      padding-top: var(--menu-height); 
      overflow-y: auto;
    }


    /* ================================================= */
    /* --- MENÚ SUPERIOR DINÁMICO (Antes .side-navbar) --- */
    /* ================================================= */
    
    .side-navbar {
      /* 🚨 POSICIÓN SUPERIOR FIJA 🚨 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--menu-height);
      
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border); /* Borde inferior */
      border-radius: 0 0 14px 14px; /* Bordes inferiores redondeados */
      overflow: hidden;
      padding: 0 20px; /* Padding horizontal */
      z-index: 998; /* Un poco menos que el preloader */
      
      /* 🚨 TRANSICIÓN PARA EL EFECTO SCROLL 🚨 */
      transition: top 0.3s ease-out, opacity 0.5s ease 0.5s;
      
      /* Estilos Flexbox para alinear los enlaces horizontalmente */
      display: flex;
      justify-content: flex-start; /* Alinea los ítems a la izquierda */
      align-items: center;
      
      opacity: 0; /* Empieza oculto y aparece con JS */
    }
    
    /* Clase que se añade con JS para ocultar el menú al hacer scroll down */
    .side-navbar.hidden-scroll {
        top: calc(0px - var(--menu-height)); /* Lo mueve hacia arriba fuera de la pantalla */
    }

    body.loaded .side-navbar {
        opacity: 1;
    }
    
    /* Reajuste de la lista y los enlaces para ser horizontales */
    .side-navbar ul { 
        list-style: none; 
        padding: 0; 
        margin: 0; 
        width: auto; /* Ancho automático */
        display: flex; /* La lista es un flex container */
    }
    
    .side-navbar li {
        margin-right: 20px; /* Espacio entre los ítems */
    }

    .side-navbar .nav-link {
      display: flex; 
      align-items: center;
      justify-content: center; /* Centra contenido del enlace */
      padding: 0 15px; /* Padding dentro del enlace */
      color: var(--fg);
      text-decoration: none; 
      height: var(--menu-height); /* Altura igual al menú */
      width: auto;
      white-space: nowrap; 
      transition: background-color 0.2s ease;
    }
  
    .side-navbar .nav-link:hover { background-color: rgba(255, 255, 255, 0.05); }
  
    .side-navbar .nav-link i {
      font-size: 1.3em; 
      width: 24px; 
      text-align: center;
      color: var(--fg);
      transition: text-shadow 0.2s ease, transform 0.2s ease;
      flex-shrink: 0;
    }
  
    /* Hacemos el texto visible, ya que en un menú superior no está 'colapsado' */
    .link-text-container { margin-left: 10px; }
    .link-text, .link-subtitle { opacity: 1; transition: none; }


    /* Tus colores de icono */
    .nav-link-perfil i      { text-shadow: 0 0 5px var(--accent-blue), 0 0 10px var(--accent-blue); }
    .nav-link-proyectos i   { text-shadow: 0 0 5px var(--accent-purple), 0 0 10px var(--accent-purple); }
    .nav-link-experiencia i { text-shadow: 0 0 5px var(--accent-emerald), 0 0 10px var(--accent-emerald); }
  
    .side-navbar .nav-link:hover i { 
      text-shadow: 0 0 12px var(--fg), 0 0 20px var(--fg);
      transform: scale(1.1);
    }
  
    .side-navbar .nav-link.active {
        background-color: rgba(255, 255, 255, 0.1);
    }

    .side-navbar .nav-link.active i {
        transform: scale(1.1);
        text-shadow: 0 0 12px var(--fg), 0 0 20px var(--fg); 
    }
    
    /* (Mantenemos los estilos del Preloader y Haku tal cual) */
    /* ... (Estilos del Preloader aquí) ... */

    /* ================================================= */
    /* --- PANTALLA DE PRECARGA (HAKU) --- */
    /* ================================================= */

    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #2c2c2c; 
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      z-index: 9999; 
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out; 
    }

    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none; 
    }
    
    /* El contenedor principal de Haku, texto y spinner */
    .haku-visual-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Ajuste vertical y horizontal */
        margin-top: -50px; 
        margin-left: -100px; 
        position: relative;
    }
    
    /* --- Contenedor del ELEMENTO COLGANTE (Cuerda + Bolita) --- */
    .hanging-element {
        position: absolute; 
        top: 55px;
        left: 5px; 
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        animation: swing-haku 3s ease-in-out infinite alternate; 
    }

    @keyframes swing-haku {
      0%   { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }


    /* --- LA CUERDA --- */
    .hanging-element::before {
        content: "";
        position: relative; 
        width: 2px; 
        height: 40px; 
        background-color: #8B4513; 
        box-shadow: 0 0 5px rgba(0,0,0,0.5); 
        border-radius: 1px;
    }

    /* --- LA BOLITA (Antes spinner) --- */
    .loading-ball {
        position: relative;
        width: 45px;
        height: 45px;
        background-color: var(--accent-blue);
        border-radius: 50%;
        box-shadow: 0 0 15px var(--accent-blue), 0 0 30px var(--accent-blue); 
        animation: pulse-ball 1.5s ease-in-out infinite alternate; 
    }

    @keyframes pulse-ball {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
    }


    /* --- TEXTO CARGANDO --- */
    .loading-text {
        font-size: 3.5em; 
        font-weight: bold;
        color: #cccccc; 
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        margin-bottom: 25px; 
        z-index: 10;
        display: flex; 
    }
    
    .loading-text span {
        opacity: 0;
        transform: translateY(-5px);
        transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    }
    
    .loading-text.animate span {
        opacity: 1;
        transform: translateY(0);
    }


    /* --- IMAGEN DE HAKU --- */
    .haku-img {
      width: 350px; 
      height: 350px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
    }

    /* ================================================= */
    /* --- OPTIMIZACIÓN RESPONSIVE (MÓVIL) --- */
    /* ================================================= */
    @media (max-width: 600px) {
        .haku-visual-container {
            margin-left: -50px; 
        }
        .haku-img {
            width: 250px; 
            height: 250px;
        }
        .loading-text {
            font-size: 2.5em;
        }
        .loading-ball {
            width: 35px;
            height: 35px;
        }
        /* Alinea el menú superior en móvil */
        .side-navbar ul {
            justify-content: space-around;
            width: 100%;
        }
    }


  </style>
</head>
<body class="unloaded">

  <div id="preloader">
    <div class="haku-visual-container">
        <div class="hanging-element">
            <div class="loading-ball"></div>
        </div>
        
        <div class="loading-text" id="loading-text-container"></div> 
        
        <img src="HAKU-SEE.png" alt="Haku Cargando" class="haku-img">
    </div>
  </div>


  <h2 style="margin-top: 0;">Demo: Menú Superior Dinámico (Scroll Up/Down)</h2>
  <p>El enlace "Perfil" tiene <code>.active</code>. Haz scroll para ver el efecto.</p>

  <nav id="main-header" class="side-navbar">
     <ul>
      <li>
        <a href="#perfil" class="nav-link nav-link-perfil active" title="Perfil">
          <i class="fa-solid fa-user"></i>
          <div class="link-text-container">
            <span class="link-text">Perfil</span>
          </div>
        </a>
      </li>
      
      <li>
        <a href="#proyectos" class="nav-link nav-link-proyectos" title="Proyectos">
          <i class="fa-solid fa-lightbulb"></i>
          <div class="link-text-container">
            <span class="link-text">Proyectos</span>
          </div>
        </a>
      </li>
      
      <li>
        <a href="#experiencia" class="nav-link nav-link-experiencia" title="Experiencia">
          <i class="fa-solid fa-briefcase"></i>
          <div class="link-text-container">
            <span class="link-text">Experiencia</span>
          </div>
        </a>
      </li>
    </ul>
  </nav>
  
  <div style="height: 1500px; padding: 20px;">
      <p>Baja el scroll para ocultar el menú. Sube el scroll para que el menú reaparezca.</p>
      <p>...</p>
      <p>El contenido sigue aquí abajo...</p>
  </div>


  <script>
    // --- LÓGICA DEL PRELOADER ---
    const textToAnimate = "Cargando";
    const container = document.getElementById('loading-text-container');
    const animationDuration = (textToAnimate.length * 50) + 1000; 
    let repeatCount = 0;
    const maxRepeats = 2; 

    function animateText() {
        container.innerHTML = '';
        container.classList.remove('animate'); 

        textToAnimate.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.textContent = char;
            container.appendChild(span);
            span.style.transitionDelay = `${index * 50}ms`; 
        });

        setTimeout(() => {
            container.classList.add('animate');
        }, 100); 

        setTimeout(() => {
            repeatCount++;
            if (repeatCount < maxRepeats) {
                animateText();
            } else {
                hidePreloader();
                // 🚨 INICIA LA LÓGICA DEL SCROLL DESPUÉS DE LA CARGA 🚨
                initScrollBehavior();
            }
        }, animationDuration);
    }

    function hidePreloader() {
        const preloader = document.getElementById('preloader');
        const body = document.body;
        
        preloader.classList.add('hidden');
        
        setTimeout(() => {
            body.classList.add('loaded');
        }, 500); 
    }

    // --- NUEVA LÓGICA DEL SCROLL (Scroll Up/Down) ---
    function initScrollBehavior() {
        const header = document.getElementById('main-header');
        const headerHeight = header.offsetHeight;
        let lastScrollTop = 0; 
        
        window.addEventListener('scroll', function() {
            const currentScroll = window.pageYOffset || document.documentElement.scrollTop;

            if (currentScroll > lastScrollTop) {
                // SCROLL DOWN (Bajando): Esconde el menú
                // Ocultamos el menú solo si hemos bajado más allá de la altura del menú
                if (currentScroll > headerHeight) {
                    header.classList.add('hidden-scroll');
                }
            } else {
                // SCROLL UP (Subiendo): Muestra el menú
                header.classList.remove('hidden-scroll');
            }
            
            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll; 
        });
    }

    // --- INICIO DE LA APLICACIÓN ---
    window.addEventListener('load', function() {
        animateText(); 
    });
  </script>

</body>
</html>
