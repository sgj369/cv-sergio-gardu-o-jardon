<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Previa: Carta de Presentación con PDF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --fg: #eef1f0;
            --accent-gold: #FFD700;
            --card-bg: rgba(0, 0, 0, 0.88);
            --text-color: #333;
        }

        /* --- ESTILOS DE PRUEBA --- */
        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Simulación de la Tarjeta */
        .card-simulation {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--card-bg);
            border-radius: 14px;
            color: var(--fg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-family: Arial, sans-serif;
        }
        
        /* Estilo del Sumario (como el de la carta) */
        .inner-summary {
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        /* Estilo para el Visor de PDF */
        .pdf-view-container iframe {
            width: 100%; 
            height: 400px; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 8px;
        }

        /* Estilos de Botones (Simulando tu diseño) */
        .button-container {
            display: flex; 
            justify-content: flex-end; 
            gap: 10px;
            margin-top: 15px;
        }

        .btn-fill-white {
            background: var(--fg); 
            color: var(--text-color); 
            padding: 8px 12px; 
            border-radius: 10px; 
            font-weight: 700; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-copy-carta {
            background: transparent; 
            border: 1px solid var(--accent-gold); 
            color: var(--accent-gold); 
            padding: 8px 12px; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px;
        }

        .btn-fill-white:hover, .btn-copy-carta:hover {
            opacity: 0.8;
        }

    </style>
</head>
<body>
    <div class="card-simulation">
        
        <h2 style="margin-top: 0; color: white;">Sección de Perfil</h2>
        
        <details open>
            <summary class="inner-summary">
                <i class="fa-solid fa-file-lines"></i>
                <span>Ver Carta de Presentación</span>
            </summary>
            
            <div class="pdf-view-container">
                <iframe src="CDP.pdf" title="Carta de Presentación en PDF"></iframe>
            </div>
            
            <div class="button-container">
                
                <a class="btn-fill-white" href="Carta_de_presentación (1).pdf" download="Carta_de_presentación.pdf" title="Descargar Carta de Presentación">
                    <i class="fa-solid fa-file-pdf"></i> Descargar PDF
                </a>

                <button class="btn-copy-carta" id="copy-carta-btn-bottom-test">
                    <i class="fa-regular fa-copy"></i> Copiar Texto
                </button>
            </div>
        </details>
        </div>
</body>
</html>
