<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejemplo de Estilos</title>
  
  <style>
    /* 1. DEFINICIÓN DE TU VARIABLE DE COLOR BLANCO */
    :root {
      /* Esta es la variable que defines como tu color blanco/claro */
      --fg: #eef1f0; 
    }

    /* 2. FONDO OSCURO PARA VER EL EFECTO */
    body {
      background-color: #333; /* El fondo oscuro de tu web */
      padding: 30px;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* =========================================
     AQUÍ ESTÁ EL CÓDIGO QUE PIDES VER
     =========================================
    */

    /* 3. EL ESTILO DEL AVATAR */
    .avatar {
      width: 120px; 
      height: 120px;
      border-radius: 50%; 
      background-color: #666; /* Un color de fondo para el círculo */
      
      /* * ¡ESTA ES LA LÍNEA!
       * Usa la variable --fg (tu color blanco) para el borde.
       */
      border: 2px solid var(--fg); 
    }

    /* 4. EL ESTILO DEL BOTÓN */
    .btn-fill-white {
      /* * ¡ESTAS SON LAS LÍNEAS!
       * Usa la variable --fg (tu color blanco) para el fondo
       * y un color oscuro para el texto.
       */
      background: var(--fg); 
      color: #333; 
      
      /* (Estilos adicionales para que parezca un botón) */
      padding: 10px 16px; 
      border-radius: 10px; 
      font-weight: 700; 
      text-decoration: none;
      border: 2px solid var(--fg); /* Borde del mismo color */
    }
    
    /* =========================================
     FIN DEL CÓDIGO
     =========================================
    */

  </style>
</head>
<body>

  <div class="avatar">
      </div>
  
  <a class="btn-fill-white" href="#">
      Portafolio Digital
  </a>

</body>
</html>
