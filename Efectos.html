<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejemplo de Estilos con Efectos</title>
  
  <style>
    /* 1. DEFINICIÓN DE TUS VARIABLES */
    :root {
      --fg: #eef1f0; /* Tu color blanco */
      --card-bg: rgba(0,0,0,0.88); /* Fondo de tarjeta de tu código */
      --card-border: rgba(255,255,255,0.1); /* Borde de tarjeta de tu código */
      --radius: 14px; /* Radius de tu código */
    }

    /* 2. FONDO OSCURO PARA VER EL EFECTO */
    body {
      background-color: #333;
      padding: 30px;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* =========================================
     CÓDIGO CON EFECTOS AÑADIDOS
     =========================================
    */

    /* 3. ESTILO DE TARJETA BASE (De tu código original) */
    .card {
      position: relative; 
      background: var(--card-bg); 
      border: 1px solid var(--card-border);
      padding: 20px; 
      border-radius: var(--radius); 
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      border-left: 5px solid; /* Base para el borde de color */
    }
    
    /* 4. ESTILO DE TU TARJETA HEADER (De tu código original) */
    .header-card {
      display: flex; 
      flex-direction: column; 
      align-items: center;
      gap: 15px; 
      padding: 25px 20px;
      
      /* Esta línea pone el borde izquierdo blanco */
      border-left-color: var(--fg);
      
      /* ¡EFECTO AÑADIDO! (Pulso de la tarjeta) */
      animation: pulse-shadow-white 2.5s infinite ease-in-out;
    }


    /* 5. EL ESTILO DEL AVATAR (CON EFECTOS) */
    .avatar {
      width: 120px; 
      height: 120px;
      border-radius: 50%; 
      background-color: #666; /* Color de relleno */
      
      /* Esta es la línea del borde blanco */
      border: 2px solid var(--fg); 
      
      /* ¡EFECTO AÑADIDO! (Pulso del avatar) */
      box-shadow: 0 0 15px rgba(238, 241, 240, 0.5);
      cursor: pointer; 
      transition: all 0.3s ease-in-out; 
      animation: pulse-avatar-glow 2.5s infinite ease-in-out;
    }

    /* 6. EL ESTILO DEL BOTÓN (CON EFECTOS) */
    .btn-fill-white {
      /* Estas son las líneas para el fondo blanco */
      background: var(--fg); 
      color: #333; 
      
      border: 2px solid var(--fg);
      padding: 10px 16px; 
      border-radius: 10px; 
      font-weight: 700; 
      text-decoration: none;
      
      /* ¡EFECTO AÑADIDO! (Sombra y transición para hover) */
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(238, 241, 240, 0.2);
    }
    
    /* ¡EFECTO AÑADIDO! (Efecto hover del botón) */
    .btn-fill-white:hover { 
      background: #cdd1d0; 
      border-color: #cdd1d0;
      box-shadow: 0 6px 20px rgba(238, 241, 240, 0.4);
      transform: translateY(-1px);
    }
    
    /* =========================================
     7. KEYFRAMES NECESARIOS PARA LAS ANIMACIONES
     (Copiados de tu código original)
     =========================================
    */
    
    /* Keyframes para el pulso del avatar */
    @keyframes pulse-avatar-glow {
        0% { box-shadow: 0 0 15px rgba(238, 241, 240, 0.5); }
        50% { box-shadow: 0 0 30px rgba(238, 241, 240, 0.8); }
        100% { box-shadow: 0 0 15px rgba(238, 241, 240, 0.5); }
    }

    /* Keyframes para el pulso de la tarjeta */
    @keyframes pulse-shadow-white {
        0% { box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
        50% { box-shadow: 0 10px 40px rgba(238, 241, 240, 0.3); }
        100% { box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
    }

  </style>
</head>
<body>

  <div class="header-card card">
  
    <div class="avatar">
        </div>
    
    <a class="btn-fill-white" href="#">
        Portafolio Digital
    </a>
    
  </div>

</body>
</html>
