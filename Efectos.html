<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  
  <title>Sergio Garduño — Contacto</title>
  
  <meta name="description" content="Contacto y perfil breve de Sergio Garduño Jardón, Ingeniero Mecatrónico." />

  <link rel="icon" href="DT-HAKU.png" type="image/x-icon">
  <meta name="theme-color" content="#072d16">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* 1. VARIABLES DE COLOR (de TD) */
    :root{
      --bg-uniform: #333; --fg: #eef1f0; --muted: #a3a3a3;
      --accent-red: #ff3366; --accent-green: #63b96f; --accent-blue: #0077b6;
      --accent-yellow: #ffc300; --accent-purple: #9933cc; --accent-gold: #FFD700;
      --accent-emerald: #2E8B57; --card-bg: rgba(0,0,0,0.88);
      --card-border: rgba(255,255,255,0.1); --radius: 14px;
      --font-sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    /* ================================================= */
    /* --- CSS DEL PRELOADER (HAKU) --- */
    /* ================================================= */

    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #2c2c2c; 
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      z-index: 9999; 
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }

    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none; 
    }
    
    .haku-visual-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }
    
    .hanging-element {
        position: absolute; 
        top: 50px; 
        left: 50px; 
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        animation: swing-haku 3s ease-in-out infinite alternate; 
    }

    @keyframes swing-haku {
      0%   { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    .hanging-element::before {
        content: "";
        position: relative; 
        width: 2px; 
        height: 40px; 
        background-color: #8B4513; 
        box-shadow: 0 0 5px rgba(0,0,0,0.5); 
        border-radius: 1px;
    }

    .loading-ball {
        position: relative;
        width: 45px;
        height: 45px;
        background-color: var(--accent-blue);
        border-radius: 50%;
        box-shadow: 0 0 15px var(--accent-blue), 0 0 30px var(--accent-blue); 
        animation: pulse-ball 1.5s ease-in-out infinite alternate; 
    }

    @keyframes pulse-ball {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
    }

    .loading-text {
        font-size: 3.5em; 
        font-weight: bold;
        color: #cccccc; 
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        margin-bottom: 25px; 
        z-index: 10;
        display: flex; 
    }
    
    .loading-text span {
        opacity: 0;
        transform: translateY(-5px);
        transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    }
    
    .loading-text.animate span {
        opacity: 1;
        transform: translateY(0);
    }

    .haku-img {
      width: 350px;
      height: 350px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
    }

    /* RESPONSIVE DEL PRELOADER */
    @media (max-width: 600px) {
        .haku-img {
            width: 250px; 
            height: 250px;
        }
        .loading-text {
            font-size: 2.5em;
        }
        .loading-ball {
            width: 35px;
            height: 35px;
        }
    }
    /* --- FIN CSS PRELOADER --- */


    /* 2. ESTILOS BASE (de TD) */
    html { background-color: var(--bg-uniform); scroll-behavior: smooth; overflow-x: hidden; }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0}
    body{
      font-family:var(--font-sans); background: transparent; color:var(--fg);
      line-height:1.5; 
      padding: 28px 25px; 
      overflow: hidden; 
    }

    body.loaded {
        overflow-y: auto;
    }

    /* 3. WRAP (Angosto) */
    .wrap{
      max-width: 420px; 
      margin:0 auto; position:relative;
      display: flex; flex-direction: column; gap: 22px;
      opacity: 0; 
      transition: opacity 0.5s ease 0.5s;
    }
    
    body.loaded .wrap {
        opacity: 1;
    }

    /* 4. ESTILOS DE TARJETA (de TD) */
    .card{
      position: relative; background: var(--card-bg); border:1px solid var(--card-border);
      padding:20px; border-radius:var(--radius); 
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      color:var(--fg); border-left: 5px solid;
    }
    .card::after {
        content: ''; position: absolute; top: 0; right: 0; 
        width: 5px; height: 35px; 
        border-top-right-radius: var(--radius); z-index: 1; 
    }

    /* 5. HEADER CARD (de TD) */
    .header-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 15px; padding: 25px 20px;
      border-left-color: var(--fg);
    }
    .header-card::after { background: var(--fg); }
    
    .avatar{
      width: 120px; height: 120px;
      border-radius: 50%; overflow:hidden; border:2px solid var(--fg); 
      box-shadow:0 0 15px rgba(238, 241, 240, 0.5);
      cursor: pointer; transition: all 0.3s ease-in-out; 
    }
    .avatar:hover { transform: scale(1.05); }
    .avatar.qr-mode {
      border-radius: var(--radius); border-color: var(--accent-green);
      transform: scale(1.1); 
    }
    .avatar.qr-mode:hover { transform: scale(1.1); }
    .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

    
    /* ================================================= */
    /* --- INICIO EFECTOS NUEVOS --- */
    /* ================================================= */

    /* --- Efecto 1: Título con Typewriter --- */
    /* Ahora para el nombre completo */
    .typewriter-title {
        font-size: 32px;
        font-weight: 900;
        color: #eef1f0; /* Color blanco directo para el texto */
        text-shadow: 0 0 10px rgba(238, 241, 240, 0.7); /* Sombra sutil */
        text-align: center;
        overflow: hidden; 
        white-space: nowrap; 
        border-right: .15em solid var(--accent-gold); /* Cursor dorado */
        animation: 
            typing-name var(--typing-speed, 3.5s) steps(var(--typing-steps, 40), end) forwards,
            blink-caret .75s step-end infinite;
        margin: 0 auto; 
        max-width: 100%;
        width: fit-content;
        box-sizing: border-box;
    }
    
    @keyframes typing-name {
      from { width: 0 }
      to { width: var(--typewriter-width-name, 100%) } 
    }

    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: var(--accent-gold); }
    }
    
    /* Leyenda debajo del nombre */
    .profile-full-description {
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
        text-align: center;
        margin-top: 10px; 
        opacity: 0; 
        transition: opacity 1s ease 0.5s; 
        max-width: 90%; 
        margin-left: auto;
        margin-right: auto;
    }
    .profile-full-description.visible {
        opacity: 1;
    }

    /* --- Efecto 2: "Pulso" en Tarjetas de Sección (Púrpura) --- */
    .pulse-card {
        border-left: 5px solid var(--accent-purple);
        animation: pulse-shadow-purple 2.5s infinite ease-in-out;
    }
    @keyframes pulse-shadow-purple {
        0% {
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
        50% {
            box-shadow: 0 10px 40px rgba(153, 51, 204, 0.4); 
        }
        100% {
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
    }

    /* --- Efecto 3: "Pulso" en Tarjetas de Sección (Azul, solo Contacto) --- */
    .pulse-card-blue {
        border-left: 5px solid var(--accent-blue); /* Borde azul */
        animation: pulse-shadow-blue 2.5s infinite ease-in-out;
    }
    @keyframes pulse-shadow-blue {
        0% {
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
        50% {
            box-shadow: 0 10px 40px rgba(0, 119, 182, 0.4); 
        }
        100% {
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
    }

    /* ================================================= */
    /* --- FIN EFECTOS NUEVOS --- */
    /* ================================================= */
    

    .btn-fill-white {
      background: var(--fg); color: #333; border: 2px solid var(--fg);
      padding: 10px 16px; border-radius: 10px; font-weight: 700; text-decoration: none;
      display: inline-flex; gap: 8px; align-items: center;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(238, 241, 240, 0.2);
    }
    .btn-fill-white:hover { 
      background: #cdd1d0; border-color: #cdd1d0;
      box-shadow: 0 6px 20px rgba(238, 241, 240, 0.4);
      transform: translateY(-1px);
    }
    .header-button-container { margin-top: 20px; text-align: center; } 

    /* 6. TARJETA DE PERFIL (de TD) */
    #perfil { /* border-left-color está en .pulse-card */ } 
    #perfil::after { background: var(--accent-blue); } 
    #perfil .profile-title { color: var(--accent-blue); font-size:18px; font-weight:800; margin-top: 0; margin-bottom:8px }
    #perfil .profile-text{ font-size:15px; line-height:1.6; text-align: center; }

    /* 7. TARJETA DE CONTACTO (de TD) */
    /* Ahora usa la clase .pulse-card-blue */
    #contacto { /* border-left-color está en .pulse-card-blue */ } 
    #contacto::after { background: var(--fg); } 
    #contacto > div:first-child { color: var(--fg); font-weight: 800; margin-bottom: 12px; font-size: 18px; }
        
    #contacto .contact-list { 
      list-style: none; padding: 0; margin: 0; 
      display: grid; 
      grid-template-columns: 1fr 1fr;
      gap: 12px; 
    }
    
    #contacto .contact-list li.full-width-btn { grid-column: span 2; }
    #contacto .contact-list li { display: block; }
    #contacto .contact-btn-pressable {
      display: flex; align-items: center; padding: 12px 16px; border-radius: 10px; 
      text-decoration: none; font-weight: 700; color: #000; 
      transition: all 0.2s ease-out; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    #contacto .contact-btn-pressable:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    #contacto .contact-btn-pressable i { font-size: 1.2em; margin-right: 12px; width: 25px text-align: center; color: inherit; }

    /* ... (resto de tus estilos de botones .btn-email, .btn-whatsapp, etc. sin cambios) ... */
    #contacto .btn-email { background: var(--accent-yellow); color: #332400; }
    #contacto .btn-email:hover { box-shadow: 0 8px 25px rgba(255, 195, 0, 0.3); }
    #contacto .btn-email i { color: #332400; } 
    #contacto .btn-email-rojo { background: var(--accent-red); color: var(--fg); }
    #contacto .btn-email-rojo span { font-size: 0.85em; }
    #contacto .btn-email-rojo:hover { box-shadow: 0 8px 25px rgba(255, 51, 102, 0.3); }
    #contacto .btn-email-rojo i { color: var(--fg); }
    #contacto .btn-whatsapp { background: var(--accent-green); color: #03120a; }
    #contacto .btn-eco { background: var(--accent-purple); color: var(--fg); }
    #contacto .btn-linkedin { background: var(--accent-blue); color: var(--fg); }
    #contacto .btn-facebook { background: #1877F2; color: var(--fg); }
    #contacto .btn-instagram { background: #FF5733; color: var(--fg); }
    #contacto .btn-instagram:hover { box-shadow: 0 8px 25px rgba(255, 87, 51, 0.3); }
    #contacto .btn-instagram i { color: var(--fg); }
    #contacto .btn-tiktok { background: #fff; color: #000; }


    /* 8. FOOTER (de TD) */
    /* Vuelve a su estado normal, sin pulso */
    footer{
      text-align:center;color:var(--muted);font-size:13px;padding:26px 0 10px;display:flex;
      align-items:center;justify-content:center;gap:10px; flex-wrap: wrap;
      opacity: 0; 
      transition: opacity 0.5s ease 0.5s;
    }
    
    body.loaded footer {
        opacity: 1;
    }
    
    .footer-brand{display:flex;align-items:center;gap:8px}
    .sello{
      width:40px; height:40px; border-radius:8px; overflow:hidden;
      transition: transform 0.2s ease;
    }
    .sello:hover { transform: scale(1.1); }
    .sello img{width:100%;height:100%;object-fit:cover}

    /* 9. PARTÍCULAS (de TD) */
    #particles-js {
      position: fixed; width: 100%; height: 100%;
      top: 0; left: 0; z-index: -1; 
      background-color: var(--bg-uniform);
    }
    
    /* 10. RESPONSIVE (de TD) */
    @media (max-width: 480px) {
        body { padding: 20px 20px; }
        .typewriter-title { font-size: 28px; } /* Ajuste de tamaño en móvil */
        .profile-full-description { font-size: 13px; } /* Ajuste de tamaño en móvil */
        .avatar { width: 100px; height: 100px; }
        footer { flex-direction: column; gap: 15px; justify-content: center; }

        #contacto .contact-list { gap: 8px; }
        #contacto .contact-btn-pressable { padding: 12px 10px; }
        #contacto .btn-email-rojo span {
            overflow-wrap: break-word;
            word-break: break-all;
            min-width: 0;
        }
    }

  </style>
</head>

<body class="unloaded">
  
  <div id="preloader">
    <div class="haku-visual-container">
        <div class="hanging-element">
            <div class="loading-ball"></div>
        </div>
        
        <div class="loading-text" id="loading-text-container"></div> 
        
        <img src="HAKU-SEE.png" alt="Haku Cargando" class="haku-img">
    </div>
  </div>
  <div id="particles-js"></div>

  <div class="wrap">
    
    <div class="header-card card">
      
      <div class="avatar" title="Clic para QR" id="avatar-container">
          <img id="avatar-img" src="perfil.png" alt="Sergio Garduño Jardón">
      </div>
