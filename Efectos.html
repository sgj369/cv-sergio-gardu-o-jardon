<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  
  <title>Test Preloader Haku</title>
  
  <style>
    /* 1. VARIABLES (Solo las necesarias) */
    :root{
      --bg-uniform: #333;
      --fg: #eef1f0;
      --font-sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto;
    }

    /* 2. ESTILOS BASE */
    html { background-color: #2c2c2c; }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0}
    body{
      font-family:var(--font-sans);
      color:var(--fg);
    }

    /* ================================================= */
    /* --- CSS DEL PRELOADER (HAKU) --- */
    /* ================================================= */

    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #2c2c2c; 
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      z-index: 9999; 
    }
    
    .haku-visual-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }
    
    .loading-text {
        font-size: 3.5em; 
        font-weight: bold;
        color: #cccccc; 
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        z-index: 10;
        display: flex; 
        
        /* --- ¡JUEGA AQUÍ! (Posición del Texto en PC) --- */
        /* Sube el texto (más negativo) o bájalo (más positivo) */
        margin-top: -50px; 
    }
    
    .loading-text span {
        opacity: 0;
        transform: translateY(-5px);
        transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    }
    
    .loading-text.animate span {
        opacity: 1;
        transform: translateY(0);
    }

    .haku-img {
      /* --- ¡JUEGA AQUÍ! (Tamaño del GIF en PC) --- */
      width: 350px;
      height: 350px;
      object-fit: contain;
      /* (Quitamos el 'filter' por si el GIF ya tiene sombra) */
    }

    /* RESPONSIVE DEL PRELOADER */
    @media (max-width: 600px) {
        .haku-img {
            /* --- ¡JUEGA AQUÍ! (Tamaño del GIF en Móvil) --- */
            width: 250px; 
            height: 250px;
        }
        .loading-text {
            font-size: 2.5em;
            /* --- ¡JUEGA AQUÍ! (Posición del Texto en Móvil) --- */
            margin-top: -30px;
        }
    }
    /* --- FIN CSS PRELOADER --- */

  </style>
</head>

<body>
  
  <div id="preloader">
    <div class="haku-visual-container">
        <img src="hakuwalk.gif" alt="Haku Cargando" class="haku-img"> 
    </div>
    
    <div class="loading-text" id="loading-text-container"></div> 
  </div>

  
  <script>
    
    /* ================================== */
    /* JAVASCRIPT DEL PRELOADER */
    /* ================================== */
    const textToAnimate = "Cargando";
    const animationDuration = (textToAnimate.length * 50) + 1000; 
    let loadingTextContainer; 

    function animateText() {
        if (!loadingTextContainer) {
             loadingTextContainer = document.getElementById('loading-text-container');
             if (!loadingTextContainer) return; // Salir si no se encuentra
        }
        
        loadingTextContainer.innerHTML = '';
        loadingTextContainer.classList.remove('animate'); 

        // Crea los spans
        textToAnimate.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.textContent = char;
            loadingTextContainer.appendChild(span);
            span.style.transitionDelay = `${index * 50}ms`; 
        });

        // Inicia la animación de entrada
        setTimeout(() => {
            loadingTextContainer.classList.add('animate');
        }, 100); 

        // Reinicia la animación para un bucle infinito
        setTimeout(() => {
            animateText(); // Se llama a sí misma para repetir
        }, animationDuration + 1000); // Espera 1s extra antes de repetir
    }

    /* ================================== */
    /* --- INICIALIZACIÓN PRINCIPAL --- */
    /* ================================== */
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Inicia el preloader
        loadingTextContainer = document.getElementById('loading-text-container');
        animateText(); 
    }); 

  </script>
</body>
</html>
